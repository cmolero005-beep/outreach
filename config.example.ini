; Copy this file to config.ini and fill it in. config.ini is never committed (it holds your password).

[email]
; "smtp"    -> Gmail / Google Workspace university accounts (uses an App Password), or any SMTP+IMAP server
; "outlook" -> Windows + the classic Outlook desktop app (Microsoft 365 university accounts; no password needed here)
method = smtp
address = you@university.edu
display_name = Your Name
; For Gmail/Google Workspace: a 16-character App Password (myaccount.google.com/apppasswords), NOT your normal password.
password =
; Gmail / Google Workspace:
smtp_host = smtp.gmail.com
smtp_port = 587
imap_host = imap.gmail.com
; Microsoft 365 (only if your school still allows SMTP AUTH - most don't; use method = outlook instead):
; smtp_host = smtp.office365.com
; smtp_port = 587
; imap_host = outlook.office365.com

[settings]
excel_file = outreach.xlsx
initial_template = templates/initial_email.txt
follow_up_template = templates/follow_up_email.txt
send_follow_ups = true
; follow up if no reply after this many WORKdays
follow_up_after_business_days = 5
; safety cap so your university account doesn't get flagged for spam
max_emails_per_day = 25
; random pause between emails (seconds) so it looks like a person sending
min_seconds_between_emails = 30
max_seconds_between_emails = 90

; Copy this file to config.ini and fill it in. config.ini is never committed.

[email]
; "applemail" -> sends through the Mac Mail app (recommended for university Outlook / Microsoft 365).
;               Add your school account to Mail first: Mail > Settings > Accounts > + > Microsoft Exchange.
; "smtp"      -> direct SMTP/IMAP login (only if your school allows it; most Microsoft 365 schools don't)
method = applemail
address = you@university.edu
display_name = Carlos Molero

; --- only used when method = smtp ---
password =
smtp_host = smtp.office365.com
smtp_port = 587
imap_host = outlook.office365.com

[settings]
excel_file = outreach.xlsx
initial_template = templates/initial_email.txt
follow_up_template = templates/follow_up_email.txt
send_follow_ups = true
; send the follow-up if there's no reply this many days after the first email
follow_up_after_days = 7
; safety cap so your university account doesn't get flagged for spam
max_emails_per_day = 25
; random pause between emails (seconds) so it looks like a person sending
min_seconds_between_emails = 30
max_seconds_between_emails = 90
